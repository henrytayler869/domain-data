name: DB apply fixes + re-test reconciler

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload + apply + retest
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./migration/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/domaindata/db/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e +x
          cd /opt/domaindata/db
          docker exec -i domaindata-db psql -v ON_ERROR_STOP=1 -U postgres -d domaindata < fixes.sql
          echo "✓ fixes.sql applied"
          ENVL=/opt/domaindata/dashboard/.env.local
          TOKEN=$(grep -m1 '^N8N_API_TOKEN=' "$ENVL" | cut -d= -f2- | tr -d "\"'")
          echo "===== trigger reconciler ====="
          docker exec -e TK="$TOKEN" n8n-dashboard-1 node -e "fetch('http://127.0.0.1:3000/api/n8n/wayback-dispatch',{method:'POST',headers:{Authorization:'Bearer '+process.env.TK}}).then(r=>r.text()).then(t=>console.log('BODY:',t.slice(0,400))).catch(e=>console.log('ERR',e.message))" 2>&1 | head -6
          echo "===== heartbeat trong DB VPS ====="
          docker exec domaindata-db psql -t -A -U postgres -d domaindata -c \
            "SELECT 'lastTickAt='||coalesce(value->>'lastTickAt','(null)') FROM app_settings WHERE key='pipeline_reconcile';" || true
          echo "DONE."
          REMOTE
