name: Show VPS IP (diagnostic)

# Chạy tay để lấy IP công khai của VPS (IP mà Gname/Apify nhìn thấy khi VPS gọi ra —
# dùng để đối chiếu whitelist). Tái dùng SSH secrets của deploy. IP được in dạng
# đổi "." → " dot " để không bị GitHub mask (khi trùng giá trị secret VPS_HOST).
on:
  workflow_dispatch:

jobs:
  ip:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Print VPS public IP
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'ip=$(curl -s -4 ifconfig.me || curl -s -4 icanhazip.com || curl -s -4 ipinfo.io/ip); \
             echo "PUBLIC_IP_SAFE=$(echo "$ip" | sed "s/\./ dot /g")"; \
             echo "HOSTNAME=$(hostname)"; \
             echo "LOCAL_IPS=$(hostname -I 2>/dev/null)"'
