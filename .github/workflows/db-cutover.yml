name: DB cutover (app → VPS self-host)

on:
  workflow_dispatch:

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Cutover + verify
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e +x
          ENVL=/opt/domaindata/dashboard/.env.local
          # 1) Backup 1 lần (rollback)
          [ -f "${ENVL}.cloud-bak" ] || cp "$ENVL" "${ENVL}.cloud-bak"
          # 2) Lấy JWT self-host, đổi 2 biến (giữ mọi biến khác)
          . /opt/domaindata/db/.env
          grep -vE '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=' "${ENVL}.cloud-bak" > "${ENVL}.tmp"
          echo "SUPABASE_URL=http://domaindata-proxy:8080" >> "${ENVL}.tmp"
          echo "SUPABASE_SERVICE_ROLE_KEY=$DD_SERVICE_ROLE_JWT" >> "${ENVL}.tmp"
          mv "${ENVL}.tmp" "$ENVL"; chmod 600 "$ENVL"
          echo "✓ .env.local → SUPABASE_URL=http://domaindata-proxy:8080"
          # 3) Rebuild + restart dashboard (bake .env.local mới)
          cd /opt/n8n
          docker compose build dashboard
          docker compose up -d dashboard
          echo "✓ rebuilt + restarted"
          # 4) Chờ app sẵn sàng
          for i in $(seq 1 30); do
            docker exec n8n-dashboard-1 node -e "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))" 2>/dev/null && break
            sleep 3
          done
          docker ps --filter name=n8n-dashboard --format '{{.Names}}  {{.Status}}'
          # 5) Trigger reconciler → test app đọc/ghi DB VPS (token qua -e, không echo)
          TOKEN=$(grep -m1 '^N8N_API_TOKEN=' "$ENVL" | cut -d= -f2- | tr -d "\"'")
          echo "===== trigger reconciler (app → VPS DB) ====="
          docker exec -e TK="$TOKEN" n8n-dashboard-1 node -e "fetch('http://127.0.0.1:3000/api/n8n/wayback-dispatch',{method:'POST',headers:{Authorization:'Bearer '+process.env.TK}}).then(r=>r.text()).then(t=>console.log('BODY:',t.slice(0,280))).catch(e=>console.log('ERR',e.message))" 2>&1 | head -5
          # 6) Heartbeat vừa ghi vào DB VPS?
          echo "===== heartbeat trong DB VPS (lastTickAt) ====="
          docker exec domaindata-db psql -t -A -U postgres -d domaindata -c \
            "SELECT value->>'lastTickAt' FROM app_settings WHERE key='pipeline_reconcile';" || true
          echo "===== dashboard logs (lỗi?) ====="
          docker logs n8n-dashboard-1 --tail 20 2>&1 | grep -iE 'supabase|error|econn|fetch failed|restricted|ready in|started' | head -8 || echo "(no matching)"
          echo "DONE."
          REMOTE
