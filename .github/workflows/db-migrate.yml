name: DB migrate to VPS (install + copy, no cutover)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload migration files
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'mkdir -p /opt/domaindata/db'
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./migration/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/domaindata/db/"

      - name: Install stack + copy data (secrets stay on VPS)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e +x
          cd /opt/domaindata/db
          ENVF=/opt/domaindata/db/.env
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          # 1) Sinh/khôi phục secrets (idempotent — giữ nguyên nếu đã có, để khớp volume DB)
          if [ ! -f "$ENVF" ]; then
            DD_PG_PASSWORD=$(openssl rand -hex 24)
            DD_AUTHENTICATOR_PASSWORD=$(openssl rand -hex 24)
            DD_JWT_SECRET=$(openssl rand -base64 36 | tr -d '\n=' | tr '+/' '-_')
            umask 177
            { echo "DD_PG_PASSWORD=$DD_PG_PASSWORD";
              echo "DD_AUTHENTICATOR_PASSWORD=$DD_AUTHENTICATOR_PASSWORD";
              echo "DD_JWT_SECRET=$DD_JWT_SECRET"; } > "$ENVF"
          fi
          set -a; . "$ENVF"; set +a
          # 2) Service_role JWT (HS256, role=service_role) ký bằng DD_JWT_SECRET
          H=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          P=$(printf '%s' '{"role":"service_role"}' | b64url)
          S=$(printf '%s' "$H.$P" | openssl dgst -sha256 -hmac "$DD_JWT_SECRET" -binary | b64url)
          JWT="$H.$P.$S"
          if ! grep -q '^DD_SERVICE_ROLE_JWT=' "$ENVF"; then echo "DD_SERVICE_ROLE_JWT=$JWT" >> "$ENVF"; fi
          # 3) Cloud creds từ .env.local VPS (không rời VPS)
          SB_URL=$(grep -m1 '^SUPABASE_URL=' /opt/domaindata/dashboard/.env.local | cut -d= -f2- | tr -d "\"'")
          SB_KEY=$(grep -m1 '^SUPABASE_SERVICE_ROLE_KEY=' /opt/domaindata/dashboard/.env.local | cut -d= -f2- | tr -d "\"'")
          echo "cloud host: $(echo "$SB_URL" | sed -E 's#https?://([^/]+).*#\1#')"
          # 4) Up DB, chờ healthy
          docker compose --env-file "$ENVF" -f docker-compose.yml up -d db
          for i in $(seq 1 40); do
            docker exec domaindata-db pg_isready -U postgres -d domaindata >/dev/null 2>&1 && break
            sleep 3
          done
          echo "DB ready."
          # 5) Schema + roles + mật khẩu authenticator (không echo)
          docker exec -i domaindata-db psql -v ON_ERROR_STOP=1 -U postgres -d domaindata < schema.sql >/dev/null
          docker exec -i domaindata-db psql -v ON_ERROR_STOP=1 -U postgres -d domaindata < roles.sql >/dev/null
          printf "ALTER ROLE authenticator PASSWORD '%s';\n" "$DD_AUTHENTICATOR_PASSWORD" | docker exec -i domaindata-db psql -q -U postgres -d domaindata >/dev/null
          echo "Schema + roles applied."
          # 6) Copy dữ liệu cloud → local
          docker run --rm --network n8n_default -v /opt/domaindata/db:/w -w /w \
            -e SB_URL="$SB_URL" -e SB_KEY="$SB_KEY" \
            -e PG_URL="postgres://postgres:$DD_PG_PASSWORD@domaindata-db:5432/domaindata" \
            node:20-alpine sh -c 'npm i --silent --no-audit --no-fund @supabase/supabase-js pg >/dev/null 2>&1 && node migrate.mjs'
          # 7) Up PostgREST + proxy
          docker compose --env-file "$ENVF" -f docker-compose.yml up -d postgrest proxy
          sleep 6
          # 8) Verify: counts từ DB đích
          echo "===== ROW COUNTS (DB đích) ====="
          docker exec -i domaindata-db psql -t -A -U postgres -d domaindata -c "
            SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;" || true
          echo "===== PostgREST end-to-end (qua proxy) ====="
          docker run --rm --network n8n_default curlimages/curl:latest -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $JWT" "http://domaindata-proxy:8080/rest/v1/domain_inventory?select=domain&limit=1" || echo "curl fail"
          echo "DONE."
          REMOTE
