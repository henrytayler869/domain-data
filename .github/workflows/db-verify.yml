name: DB verify (PostgREST + counts)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e +x
          cd /opt/domaindata/db
          . ./.env
          echo "===== EXACT COUNTS (DB đích) ====="
          docker exec domaindata-db psql -t -A -U postgres -d domaindata -c \
            "SELECT 'domain_inventory='||count(*) FROM domain_inventory
             UNION ALL SELECT 'target_assessment='||count(*) FROM target_assessment
             UNION ALL SELECT 'wayback_results='||count(*) FROM wayback_results
             UNION ALL SELECT 'gname_checks='||count(*) FROM gname_checks
             UNION ALL SELECT 'ahrefs_results='||count(*) FROM ahrefs_results
             UNION ALL SELECT 'backlink_db='||count(*) FROM backlink_db;"
          docker exec domaindata-db psql -U postgres -d domaindata -c "ANALYZE;" >/dev/null 2>&1 || true
          echo "===== PostgREST end-to-end (Supabase-style qua proxy) ====="
          docker run --rm --network n8n_default curlimages/curl:latest -s -w '\nHTTP %{http_code}\n' \
            -H "apikey: $DD_SERVICE_ROLE_JWT" -H "Authorization: Bearer $DD_SERVICE_ROLE_JWT" \
            "http://domaindata-proxy:8080/rest/v1/domain_inventory?select=domain,rating,sell_price&limit=2"
          echo "===== container status ====="
          docker ps --filter name=domaindata --format '{{.Names}}  {{.Status}}'
          REMOTE
